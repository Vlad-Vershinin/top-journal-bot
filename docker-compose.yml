name: top-journal-bot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: top-journal-bot:latest
    container_name: top-journal-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  casino:
    profiles: [casino]
    build:
      context: .
      dockerfile: Dockerfile
    image: top-journal-bot:latest
    command: [python, -m, journal_bot.casino_server]
    restart: unless-stopped
    env_file: [.env]
    environment:
      CASINO_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  casino-tunnel:
    profiles: [casino]
    image: cloudflare/cloudflared:latest
    command: [tunnel, --no-autoupdate, --url, "http://casino:8080"]
    restart: unless-stopped
    depends_on: [casino]
